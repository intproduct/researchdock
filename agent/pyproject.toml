[project]
name = "research-manager-agent"
version = "0.1.0"
description = "Read-only Git working-copy observer for Research Manager"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
research-agent = "research_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_agent"]

[tool.ruff]
extend = "../pyproject.toml"
target-version = "py311"
