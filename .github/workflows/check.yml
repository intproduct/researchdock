name: Check
on: [push, pull_request]
jobs:
  # SQLite + frontend build: the default local workflow, always runs.
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e ./backend -e ./agent
      - run: python -m pytest backend/tests agent/tests -q
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # Real PostgreSQL: schema built purely from Alembic migrations (no
  # create_all), so this proves the migration chain works on the deploy target.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: research
          POSTGRES_DB: research_test
          POSTGRES_PASSWORD: ci-test-postgres-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U research -d research_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e ./backend -e ./agent
      - name: Backend research suite on PostgreSQL (Alembic-migrated schema)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://research:ci-test-postgres-password@localhost:5432/research_test
          TEST_SCHEMA_FROM_MIGRATIONS: "1"
        run: python -m pytest backend/tests -q
