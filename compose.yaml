name: research-manager
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-research}
      POSTGRES_USER: ${POSTGRES_USER:-research}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-research} -d ${POSTGRES_DB:-research}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    env_file: ${ENV_FILE:-.env}
    environment:
      # Percent-encoded inside Settings from POSTGRES_PASSWORD; never printed.
      POSTGRES_USER: ${POSTGRES_USER:-research}
      POSTGRES_DB: ${POSTGRES_DB:-research}
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the env file}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python -m alembic upgrade head && python -m app.initial_data"]

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-research}
      POSTGRES_DB: ${POSTGRES_DB:-research}
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the env file}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Ready means the API can reach the database, not merely that it started.
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/utils/readiness/')"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    ports:
      # Loopback only: the database is never published outside the compose network.
      - "127.0.0.1:${PUBLIC_PORT:-8080}:80"
    depends_on: [backend]
    restart: unless-stopped

volumes:
  postgres-data:
